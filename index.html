<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elegant Polo Productivity Suite</title>
<!-- Google Fonts for elegance -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&amp;family=Roboto&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">


<header>
  <h1>My Productivity Suite</h1>
  <div class="header-buttons">
    <button id="toggleTheme">Toggle Dark Mode</button>
    <button id="focusModeBtn">Focus Mode</button>
  </div>
</header>

<nav>
  <button class="nav-btn" data-section="tasks">Tasks</button>
  <button class="nav-btn" data-section="notes">Notes</button>
  <button class="nav-btn" data-section="calendar">Calendar</button>
  <button class="nav-btn" data-section="progress">Progress</button>
  <button class="nav-btn" data-section="settings">Settings</button>
</nav>

<main>
  <!-- Tasks Section -->
  <section id="tasks" class="section active">
    <h2>Task Management</h2>
    <div class="task-controls">
      <input type="text" id="taskTitleInput" placeholder="Task Title">
      <input type="date" id="taskDeadline">
      <select id="taskPriority">
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
      <button onclick="addTask()">Add Task</button>
    </div>
    <div class="task-filters">
      <button onclick="filterTasks('all')">All</button>
      <button onclick="filterTasks('high')">High</button>
      <button onclick="filterTasks('medium')">Medium</button>
      <button onclick="filterTasks('low')">Low</button>
    </div>
    <ul id="taskList"></ul>
  </section>

  <!-- Subtasks Modal (hidden, for adding subtasks) -->
  <div id="subtaskModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeSubtaskModal()">×</span>
      <h3>Add Subtask</h3>
      <input type="text" id="subtaskInput" placeholder="Subtask description">
      <button onclick="saveSubtask()">Save Subtask</button>
    </div>
  </div>

  <!-- Notes Section -->
  <section id="notes" class="section">
    <h2>Notes</h2>
    <textarea id="noteInput" placeholder="Write your notes here..."></textarea>
    <button onclick="saveNote()">Save Note</button>
    <div id="notesContainer"></div>
  </section>

  <!-- Calendar Section -->
  <section id="calendar" class="section">
    <h2>Calendar</h2>
    <div id="calendarContainer"></div>
  </section>

  <!-- Progress Tracking -->
  <section id="progress" class="section">
    <h2>Progress Tracker</h2>
    <p>Track your completed tasks and productivity stats.</p>
    <div id="progressStats"></div>
  </section>

  <!-- Settings -->
  <section id="settings" class="section">
    <h2>Settings</h2>
    <label>
      <input type="checkbox" id="autoSave" checked="">
      Auto Save
    </label>
  </section>
</main>

<!-- Scripts -->
<script src="script.js"></script>

<script src="./script.js"></script></body></html>
